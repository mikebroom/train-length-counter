name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk TrainLengthCounter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrainLengthCounter-apk
          path: TrainLengthCounter.apk
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TrainLengthCounter.apk --title "Train Length Counter" --notes "Built from ${{ github.sha }}"
      - name: Save APK to apk branch
        run: |
          mkdir out && cp TrainLengthCounter.apk out/ && cd out
          git init -q && git checkout -q -b apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add . 
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
